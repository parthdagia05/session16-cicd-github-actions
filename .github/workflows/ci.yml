# CI = Continuous Integration
# Every push / pull request to main is linted, tested, scanned and built.
# If any check fails, the later jobs do not run.
name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 app tests

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Show runner info
        run: |
          echo "Runner OS:   ${{ runner.os }}"
          echo "Runner arch: ${{ runner.arch }}"
          python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v --cov=app --cov-report=term --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Check for sensitive files
        run: |
          echo "Checking repository for common sensitive files..."
          if find . -path ./.git -prune -o -type f \( \
            -name ".env" -o -name "*.pem" -o -name "*.key" \
          \) -print | grep .; then
            echo "Potential sensitive file found."
            exit 1
          fi
          echo "No common sensitive files found."

  build:
    name: Build Application
    needs: [lint, test, security-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Build application
        env:
          APP_VERSION: ${{ github.sha }}
        run: ./build.sh

      - name: Show build output
        run: cat build/build-info.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: calculator-build
          path: build/
          retention-days: 7

  docker-build:
    name: Docker Build & Smoke Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build --build-arg APP_VERSION=${{ github.sha }} -t calculator:ci .

      - name: Run container
        run: docker run -d --name calculator -p 5000:5000 calculator:ci

      - name: Smoke test
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:5000/health && break
            sleep 1
          done
          echo
          curl -sf "http://localhost:5000/calc/add?a=10&b=5"
          echo
          curl -sf "http://localhost:5000/calc/add?a=10&b=5" | grep -q '"result":15'

      - name: Container logs
        if: always()
        run: docker logs calculator
